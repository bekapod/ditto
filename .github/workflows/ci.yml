name: CI

on:
  push:

permissions:
  contents: read

env:
  GBDK_VERSION: "4.5.0"
  GBDK_SHA256: d7857a5f6d135ee4c249043ca26aad9f2ec8ab5d4106d97720d404114f42605c

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install GBDK
        run: |
          curl -fsSL -o gbdk.tar.gz "https://github.com/gbdk-2020/gbdk-2020/releases/download/${GBDK_VERSION}/gbdk-linux64.tar.gz"
          echo "${GBDK_SHA256}  gbdk.tar.gz" | sha256sum -c
          tar -xzf gbdk.tar.gz -C "$HOME"
          echo "GBDK_HOME=$HOME/gbdk/" >> "$GITHUB_ENV"

      - name: Install hUGETracker converter
        run: |
          curl -fsSL -o hugetracker.zip "https://github.com/SuperDisk/hUGETracker/releases/download/v1.0.11/hUGETracker-1.0.11-linux.zip"
          echo "9e2e21d50d2ebbeb5653168c483279b188ff1b01b908b685172b0b353e506e24  hugetracker.zip" | sha256sum -c
          mkdir -p "$HOME/.local/bin"
          unzip -q hugetracker.zip uge2source -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: tests/uv.lock

      - name: Build ROM
        run: make

      - name: Run tests
        run: make test
